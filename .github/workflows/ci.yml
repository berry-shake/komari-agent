name: CI
on:
  push:
    branches: [mod]
  pull_request:
    branches: [mod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test -short ./...
      - run: go test -race -short ./server ./update ./utils ./ws
      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - run: go build -o build/check .
      - name: Compile all supported release platforms
        run: bash build_all.sh
      - name: Generate checksums
        run: python3 scripts/release.py checksums build
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Windows credentials and updater
        run: go test -short ./utils ./update ./server
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'build_all.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
