name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable fork tag (1.2.60-fork.N)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag }}
jobs:
  prepare:
    if: github.repository == 'berry-shake/komari-agent'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mod
          fetch-depth: 0
      - id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py prepare "$TAG" 1.2.60 berry-shake/komari-agent
  binaries:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test -short ./...
      - name: Build all supported platforms
        env:
          VERSION: ${{ inputs.tag }}
        run: bash build_all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: build/*
          if-no-files-found: error
  publish:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build
          merge-multiple: true
      - run: python3 scripts/release.py checksums build
      - run: cp build/komari-agent-linux-amd64 build/komari-agent-linux-arm64 .
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/berry-shake/komari-agent:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/berry-shake/komari-agent
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          provenance: false
      - name: Verify tag still identifies the built commit
        run: |
          git fetch --depth=1 origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" build/* --repo "$GITHUB_komari-agentSITORY" --verify-tag --draft --title "$TAG" --generate-notes
          gh release edit "$TAG" --repo "$GITHUB_komari-agentSITORY" --draft=false --prerelease=false --latest
      - name: Promote image latest
        run: docker buildx imagetools create --tag ghcr.io/berry-shake/komari-agent:latest "ghcr.io/berry-shake/komari-agent:$TAG"
